# ==============================================================================
# HINCHMART B2B MARKETPLACE - CONFIGURATION (MYSQL SQL DATABASE)
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

# Spring Application Name
spring.application.name=hinchmart-backend

# ==============================================================================
# DATABASE CONFIGURATION (MySQL SQL Database)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
# Set DB_PASSWORD in the environment; do not commit database credentials.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# JACKSON JSON SERIALIZATION
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# OTP VERIFICATION SETTINGS
# ==============================================================================
hinchmart.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
hinchmart.otp.default-test-code=${OTP_DEFAULT_TEST_CODE:123456}

# ==============================================================================
# CORS (CROSS-ORIGIN RESOURCE SHARING)
# ==============================================================================
hinchmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==============================================================================
# DATA SEEDING (Auto-seeds Categories, Brands, Tata Tiscon with Bulk Tiers, Demo Users)
# ==============================================================================
hinchmart.seed.enabled=true

# ==============================================================================
# SWAGGER / OPENAPI UI DOCUMENTATION
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
