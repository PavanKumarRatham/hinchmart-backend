name: Build and Deploy Backend

on:
  push:
    branches:
     - pavansai/feature-branch
  workflow_dispatch:

permissions:
  contents: read

env:
  ECR_REPOSITORY: hinchmart

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot JAR
        shell: bash
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-2.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DDL_AUTO: ${{ secrets.DB_DDL_AUTO }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCOUNT_ID,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_DDL_AUTO
          script_stop: true
          script: |
            set -eu

            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-2.amazonaws.com"
            IMAGE="${ECR_REGISTRY}/hinchmart:latest"

            aws ecr get-login-password --region ap-south-2 | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
            docker pull "${IMAGE}"

            docker stop hinchmart 2>/dev/null || true
            docker rm hinchmart 2>/dev/null || true

            docker run -d \
              --name hinchmart \
              --restart unless-stopped \
              -p 9000:9000 \
              -e PORT=9000 \
              -e DB_HOST="${DB_HOST}" \
              -e DB_PORT="${DB_PORT}" \
              -e DB_NAME="${DB_NAME}" \
              -e DB_USERNAME="${DB_USERNAME}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e DB_DDL_AUTO="${DB_DDL_AUTO}" \
              "${IMAGE}"

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://localhost:9000/api/health > /dev/null; then
                echo "Health check passed."
                docker image prune --force
                docker container prune --force
                exit 0
              fi
              echo "Waiting for application health check (${attempt}/12)..."
              sleep 5
            done

            echo "Health check failed. Recent container logs:"
            docker logs --tail 100 hinchmart
            exit 1
